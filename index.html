<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | シクナイちゃんねる</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='12' fill='%23991b1b'/%3E%3Cpath d='M20 32l8 8 16-16' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 40%, #991b1b 100%);
      background-attachment: fixed;
      font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
      overflow-x: hidden;
    }
    .bg-orbs {
      position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5;
      animation: floatOrb 18s ease-in-out infinite;
    }
    .orb1 { width: 400px; height: 400px; background: #ef4444; top: -100px; left: -100px; }
    .orb2 { width: 350px; height: 350px; background: #8b5cf6; bottom: -80px; right: -80px; animation-delay: -6s; }
    .orb3 { width: 300px; height: 300px; background: #f59e0b; top: 40%; left: 50%; animation-delay: -12s; }
    @keyframes floatOrb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.1); }
      66% { transform: translate(-30px, 40px) scale(0.95); }
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .login-btn {
      position: relative; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(0,0,0,0.3); }
    .login-btn:active { transform: translateY(0); }
    .login-btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.6s;
    }
    .login-btn:hover::before { left: 100%; }
    .fade-in { animation: fadeIn 0.7s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .pulse-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.7); }
      70% { box-shadow: 0 0 0 12px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
    .spinner {
      width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #ef4444; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      gap: 18px; text-align: center; padding: 24px;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    }
    .status-overlay.hidden { display: none; }
    .status-overlay .title { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: 0.05em; }
    .status-overlay .sub { font-size: 14px; color: #d1d5db; line-height: 1.8; max-width: 420px; }
    .status-overlay .actions { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn-switch {
      background: #2563eb; color: #fff; font-size: 14px; padding: 12px 24px;
      border-radius: 8px; border: none; cursor: pointer; font-weight: 700;
      transition: background 0.2s;
    }
    .btn-switch:hover { background: #1d4ed8; }
    .badge-pill {
      display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 999px;
      font-weight: 700; letter-spacing: 0.05em;
    }
    .role-admin { background: #7c2d12; color: #fff; }
    .role-owner { background: #1e40af; color: #fff; }
    .role-vip { background: #7c3aed; color: #fff; }
    .role-none { background: #374151; color: #d1d5db; }
    .step-item { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .step-num {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      background: rgba(255,255,255,0.15); color: #fff; font-weight: 800;
      display: flex; align-items: center; justify-content: center; font-size: 13px;
    }
    .step-text { font-size: 13px; color: #e5e7eb; line-height: 1.7; }
    .step-text strong { color: #fca5a5; }
    .footer-note { font-size: 11px; color: rgba(255,255,255,0.4); text-align: center; margin-top: 24px; }
    .secure-line {
      font-family: monospace; font-size: 10px; color: rgba(255,255,255,0.35);
      letter-spacing: 0.15em; text-align: center; margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- 背景オーブ -->
  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>

  <!-- 起動ローディング -->
  <div id="bootOverlay" class="status-overlay">
    <div class="spinner"></div>
    <div class="sub">認証状態を確認しています...</div>
    <div class="secure-line">SECURE AUTHENTICATION PORTAL</div>
  </div>

  <!-- BAN / 承認待ちオーバーレイ -->
  <div id="statusOverlay" class="status-overlay hidden">
    <div class="title" id="statusTitle"></div>
    <div class="sub" id="statusSub"></div>
    <div class="actions" id="statusActions" style="display:none;">
      <button class="btn-switch" id="switchAccountBtn">別のGoogleアカウントでログイン</button>
    </div>
    <div class="secure-line">SECURE AUTHENTICATION PORTAL</div>
  </div>

  <!-- メインカード -->
  <div class="relative z-10 min-h-screen flex items-center justify-center p-4">
    <div class="glass-card rounded-3xl w-full max-w-md p-8 sm:p-10 fade-in">

      <!-- ロゴ -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-red-500 to-red-800 shadow-lg mb-4">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-white tracking-wide mb-1">シクナイちゃんねる</h1>
        <p class="text-xs text-red-200/70 tracking-widest">SECURE LOGIN PORTAL</p>
      </div>

      <!-- 接続状態 -->
      <div class="flex items-center justify-center gap-2 mb-6">
        <span class="pulse-dot"></span>
        <span class="text-xs text-green-300/80" id="connText">認証サーバーに接続中...</span>
      </div>

      <!-- ログインボタン -->
      <button id="googleLoginBtn"
        class="login-btn w-full bg-white hover:bg-gray-50 text-gray-800 font-bold py-4 px-6 rounded-xl shadow-lg flex items-center justify-center gap-3 transition">
        <svg width="22" height="22" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C41.4 35.3 44 30.1 44 24c0-1.3-.1-2.3-.4-3.5z"/>
        </svg>
        <span class="text-base">Googleでログイン</span>
      </button>

      <!-- 区切り -->
      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-white/15"></div>
        <span class="text-xs text-white/40">安全な認証</span>
        <div class="flex-1 h-px bg-white/15"></div>
      </div>

      <!-- 説明ステップ -->
      <div class="space-y-1">
        <div class="step-item">
          <div class="step-num">1</div>
          <div class="step-text"><strong>Googleアカウント</strong>でログインします。</div>
        </div>
        <div class="step-item">
          <div class="step-num">2</div>
          <div class="step-text">初回は<strong>管理者または主による承認</strong>が必要です。</div>
        </div>
        <div class="step-item">
          <div class="step-num">3</div>
          <div class="step-text">承認されると<strong>自動的にサイトへ移動</strong>します。</div>
        </div>
      </div>

      <!-- 注意 -->
      <div class="mt-6 p-3 rounded-lg bg-amber-500/10 border border-amber-400/30">
        <p class="text-xs text-amber-200 leading-relaxed text-center">
          ⚠️ 投稿は匿名で表示されます<br>
          メールアドレスは管理者・主のみ閲覧可能です
        </p>
      </div>

      <!-- フッター -->
      <div class="footer-note">
        © シクナイちゃんねる / login portal
      </div>
      <div class="secure-line">ENCRYPTED CONNECTION • TLS 1.3</div>
    </div>
  </div>

  <!-- ロール表示（ログイン後、リダイレクト前の一瞬表示用） -->
  <div id="roleFlash" class="fixed top-4 right-4 z-50 hidden">
    <div class="glass-card rounded-xl px-4 py-2">
      <span id="roleFlashText" class="text-xs text-white font-bold"></span>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import {
      getDatabase, ref, set, get, update, onValue, remove
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      setPersistence, browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ===== Firebase 設定（元サイトと同一プロジェクトを共有） =====
    const firebaseConfig = {
      apiKey: "AIzaSyBCoiJAnVWIOH9csEPlDyWJgfj6sSlNO2o",
      authDomain: "chaneler-52b95.firebaseapp.com",
      projectId: "chaneler-52b95",
      databaseURL: "https://chaneler-52b95-default-rtdb.firebaseio.com",
      storageBucket: "chaneler-52b95.firebasestorage.app",
      messagingSenderId: "538510918184",
      appId: "1:538510918184:web:58232aa80922ff00b92b1d",
      measurementId: "G-QF3LDMNQYQ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    setPersistence(auth, browserLocalPersistence).catch((err) => {
      console.warn('永続化設定失敗:', err);
    });

    // ===== ロール定義 =====
    const ROLE_ADMIN_EMAIL = "katou.noel114514@gmail.com";
    const ROLE_OWNER_EMAIL = "18107@v.nakijin.ed.jp";
    const ROLE_VIP_EMAILS = [
      "18104@v.nakijin.ed.jp",
      "setsu.setsuna1229@gmail.com",
      "roblox.2026.20th@gmail.com"
    ];

    // ===== リダイレクト先（元サイトのURL） =====
    // ※ 実際の公開URLに合わせて変更してください
    const REDIRECT_URL = "https://7chanel.noel-k27.workers.dev";

    // ===== 状態管理 =====
    let currentUser = null;
    let userRole = null;
    let myFingerprint = null;
    let bansCache = {};
    let deviceBansCache = {};
    let approvedCache = {};
    let knownUsersCache = {};
    let intentionalSignOut = false;
    let initialAuthCheckDone = false;
    let bansUnsubscribe = null;
    let deviceBansUnsubscribe = null;
    let approvedUnsubscribe = null;
    let knownUsersUnsubscribe = null;

    // ===== DOM =====
    const bootOverlay = document.getElementById('bootOverlay');
    const statusOverlay = document.getElementById('statusOverlay');
    const statusTitle = document.getElementById('statusTitle');
    const statusSub = document.getElementById('statusSub');
    const statusActions = document.getElementById('statusActions');
    const connText = document.getElementById('connText');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const switchAccountBtn = document.getElementById('switchAccountBtn');
    const roleFlash = document.getElementById('roleFlash');
    const roleFlashText = document.getElementById('roleFlashText');

    // ===== ユーティリティ =====
    function roleFromEmail(email) {
      if (!email) return null;
      const e = email.toLowerCase().trim();
      if (e === ROLE_ADMIN_EMAIL.toLowerCase()) return 'admin';
      if (e === ROLE_OWNER_EMAIL.toLowerCase()) return 'owner';
      if (ROLE_VIP_EMAILS.map(x => x.toLowerCase()).includes(e)) return 'vip';
      return null;
    }

    function isProtectedEmail(email) {
      if (!email) return false;
      const e = email.toLowerCase().trim();
      return e === ROLE_ADMIN_EMAIL.toLowerCase() || e === ROLE_OWNER_EMAIL.toLowerCase();
    }

    function generateFingerprint() {
      const parts = [
        navigator.userAgent,
        navigator.language,
        (navigator.languages || []).join(','),
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        new Date().getTimezoneOffset(),
        navigator.platform || '',
        navigator.hardwareConcurrency || '',
        navigator.deviceMemory || '',
        navigator.maxTouchPoints || 0
      ];
      const raw = parts.join('|');
      function hash(str) {
        let h1 = 0x811c9dc5;
        let h2 = 0xcbf29ce4;
        for (let i = 0; i < str.length; i++) {
          const c = str.charCodeAt(i);
          h1 ^= c; h1 = Math.imul(h1, 0x01000193);
          h2 ^= c; h2 = Math.imul(h2, 0x01000193);
        }
        return (h1 >>> 0).toString(16).padStart(8, '0') +
               (h2 >>> 0).toString(16).padStart(8, '0');
      }
      return 'fp_' + hash(raw);
    }

    function emailToKey(email) {
      if (!email) return '';
      const lower = email.toLowerCase().trim();
      let h1 = 0x811c9dc5;
      for (let i = 0; i < lower.length; i++) {
        h1 ^= lower.charCodeAt(i);
        h1 = Math.imul(h1, 0x01000193);
      }
      return 'em_' + (h1 >>> 0).toString(16).padStart(8, '0');
    }

    // ===== UI 制御 =====
    function hideBoot() {
      bootOverlay.classList.add('hidden');
    }

    function showStatus(title, sub, showSwitch) {
      statusTitle.textContent = title;
      statusSub.innerHTML = sub;
      if (showSwitch) {
        statusActions.style.display = 'flex';
      } else {
        statusActions.style.display = 'none';
      }
      statusOverlay.classList.remove('hidden');
    }

    function hideStatus() {
      statusOverlay.classList.add('hidden');
    }

    function flashRole(role) {
      const map = {
        admin: { text: '管理者としてログイン', cls: 'role-admin' },
        owner: { text: '主としてログイン', cls: 'role-owner' },
        vip:   { text: 'VIPとしてログイン', cls: 'role-vip' },
        none:  { text: '一般ユーザーとしてログイン', cls: 'role-none' }
      };
      const info = map[role] || map.none;
      roleFlashText.textContent = info.text;
      roleFlashText.className = 'text-xs font-bold ' + info.cls + ' px-2 py-1 rounded';
      roleFlash.classList.remove('hidden');
      setTimeout(() => roleFlash.classList.add('hidden'), 2500);
    }

    // ===== BAN チェック =====
    function checkSelfBan() {
      if (!currentUser) return false;
      if (isProtectedEmail(currentUser.email) || userRole === 'admin' || userRole === 'owner') {
        return false;
      }
      if (bansCache && bansCache[currentUser.uid]) { executeBan(); return true; }
      const emailKey = emailToKey(currentUser.email);
      if (emailKey && bansCache && bansCache[emailKey]) { executeBan(); return true; }
      if (myFingerprint && deviceBansCache && deviceBansCache[myFingerprint]) {
        executeBan(); return true;
      }
      return false;
    }

    async function checkAndApplyDeviceBan(user, fp) {
      if (!user || !fp) return false;
      const role = roleFromEmail(user.email);
      if (role === 'admin' || role === 'owner') return false;
      if (isProtectedEmail(user.email)) return false;

      try {
        const snap = await get(ref(db, `deviceBans/${fp}`));
        if (!snap.exists()) return false;

        const now = Date.now();
        const banData = {
          bannedAt: now,
          bannedBy: "SYSTEM_DEVICE_LINK",
          reason: "BAN済み端末からのアクセス検知（アカウント切り替え）",
          email: user.email || "",
          uid: user.uid
        };

        const updates = {};
        updates[`bans/${user.uid}`] = banData;
        if (user.email) {
          const ek = emailToKey(user.email);
          if (ek) updates[`bans/${ek}`] = banData;
        }
        await update(ref(db), updates);
        console.log('端末BAN連鎖: このアカウントもBAN登録しました', user.email);
        return true;
      } catch (err) {
        console.error('端末BAN連鎖エラー:', err);
        return true;
      }
    }

    function executeBan() {
      showStatus(
        'アクセスが拒否されました',
        'このアカウントはBANされています。<br>別のGoogleアカウントでログインしてください。',
        true
      );
      document.body.style.background = '#000';
    }

    function executePending() {
      showStatus(
        '承認待ちです',
        '管理者または主による承認をお待ちください。<br>承認されたら、もう一度このページを開いてください。<br><br>' +
        '<small style="color:#9ca3af;">この画面は自動更新されません。</small>',
        true
      );
    }

    // ===== リスナー =====
    function initBansListener() {
      if (bansUnsubscribe) bansUnsubscribe();
      bansUnsubscribe = onValue(ref(db, 'bans'), (snap) => {
        bansCache = snap.exists() ? snap.val() : {};
        checkSelfBan();
      }, (err) => console.error('BAN監視エラー:', err));
    }

    function initDeviceBansListener() {
      if (deviceBansUnsubscribe) deviceBansUnsubscribe();
      deviceBansUnsubscribe = onValue(ref(db, 'deviceBans'), (snap) => {
        deviceBansCache = snap.exists() ? snap.val() : {};
        checkSelfBan();
      }, (err) => console.error('デバイスBAN監視エラー:', err));
    }

    function initApprovedListener() {
      if (approvedUnsubscribe) approvedUnsubscribe();
      approvedUnsubscribe = onValue(ref(db, 'approvedUsers'), (snap) => {
        approvedCache = snap.exists() ? snap.val() : {};
      }, (err) => console.error('承認済み監視エラー:', err));
    }

    function initKnownUsersListener() {
      if (knownUsersUnsubscribe) knownUsersUnsubscribe();
      knownUsersUnsubscribe = onValue(ref(db, 'knownUsers'), (snap) => {
        knownUsersCache = snap.exists() ? snap.val() : {};
      }, (err) => console.error('既知ユーザー監視エラー:', err));
    }

    // ===== 承認チェック =====
    function isApproved(uid) {
      if (userRole === 'admin' || userRole === 'owner' || userRole === 'vip') return true;
      return !!approvedCache[uid];
    }

    async function requestApproval(user) {
      try {
        const snap = await get(ref(db, `approvedUsers/${user.uid}`));
        if (snap.exists()) return;
        await set(ref(db, `pendingUsers/${user.uid}`), {
          email: user.email || '',
          displayName: user.displayName || '',
          requestedAt: Date.now(),
          fingerprint: myFingerprint || ''
        });
      } catch (e) {
        console.warn('承認申請スキップ:', e.message);
      }
    }

    async function registerUser(user) {
      const now = Date.now();
      try {
        await update(ref(db, `userDevices/${user.uid}`), { [myFingerprint]: now });
      } catch (e) { console.warn('フィンガープリント登録スキップ:', e.message); }

      try {
        const userRef = ref(db, `knownUsers/${user.uid}`);
        const snap = await get(userRef);
        const existing = snap.exists() ? snap.val() : null;
        await update(userRef, {
          email: user.email || '',
          displayName: user.displayName || '',
          lastSeen: now,
          firstSeen: existing && existing.firstSeen ? existing.firstSeen : now,
          role: userRole || null,
          lastFingerprint: myFingerprint
        });
      } catch (e) { console.warn('knownUsers 登録スキップ:', e.message); }
    }

    // ===== ログインボタン =====
    googleLoginBtn.addEventListener('click', async () => {
      googleLoginBtn.disabled = true;
      googleLoginBtn.innerHTML = '<div class="spinner" style="width:22px;height:22px;border-width:2px;"></div><span class="text-base">ログイン中...</span>';
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error('ログインエラー:', err);
        if (err.code !== 'auth/popup-closed-by-user') {
          alert('ログインに失敗しました: ' + (err.message || ''));
        }
      } finally {
        googleLoginBtn.disabled = false;
        googleLoginBtn.innerHTML = `
          <svg width="22" height="22" viewBox="0 0 48 48">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C41.4 35.3 44 30.1 44 24c0-1.3-.1-2.3-.4-3.5z"/>
          </svg>
          <span class="text-base">Googleでログイン</span>`;
      }
    });

    // ===== アカウント切り替え =====
    switchAccountBtn.addEventListener('click', async () => {
      intentionalSignOut = true;
      try { await signOut(auth); } catch (e) { console.error(e); }
      hideStatus();
      document.body.style.background = '';
      setTimeout(() => {
        intentionalSignOut = false;
        initialAuthCheckDone = false;
      }, 500);
    });

    // ===== 認証状態監視 =====
    onAuthStateChanged(auth, async (user) => {
      if (intentionalSignOut) {
        currentUser = null;
        userRole = null;
        return;
      }

      currentUser = user;

      if (!user) {
        userRole = null;
        hideBoot();
        hideStatus();
        connText.textContent = '未ログイン';
        return;
      }

      userRole = roleFromEmail(user.email);
      myFingerprint = generateFingerprint();

      // リスナー開始
      initBansListener();
      initDeviceBansListener();
      initApprovedListener();
      initKnownUsersListener();

      // 保護ユーザーはBANチェックをスキップ
      if (!isProtectedEmail(user.email) && userRole !== 'admin' && userRole !== 'owner') {
        const isDeviceBanned = await checkAndApplyDeviceBan(user, myFingerprint);
        if (isDeviceBanned) { executeBan(); return; }
        if (checkSelfBan()) return;
      }

      // 承認済みリストを取得
      try {
        const snap = await get(ref(db, 'approvedUsers'));
        approvedCache = snap.exists() ? snap.val() : {};
      } catch (e) {
        console.warn('承認済みリスト取得スキップ:', e.message);
      }

      // 承認チェック
      if (!isApproved(user.uid)) {
        await requestApproval(user);
        hideBoot();
        executePending();
        return;
      }

      // ユーザー登録
      await registerUser(user);

      // ロール表示
      flashRole(userRole || 'none');

      // 接続表示
      connText.textContent = '認証成功';

      // リダイレクト
      hideBoot();
      hideStatus();
      console.log('認証成功、リダイレクトします:', REDIRECT_URL, 'ロール:', userRole || '一般');
      setTimeout(() => {
        window.location.replace(REDIRECT_URL);
      }, 800);
    });

    // ===== セキュリティ =====
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        showStatus('警告', '開発者ツールの使用は禁止されています。', false);
        return false;
      }
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['I','i','J','j'].includes(e.key)) {
        e.preventDefault();
        showStatus('警告', '開発者ツールの使用は禁止されています。', false);
        return false;
      }
      if ((e.ctrlKey || e.metaKey) && ['U','u'].includes(e.key)) {
        e.preventDefault();
        showStatus('警告', 'ソースコードの表示は禁止されています。', false);
        return false;
      }
    });

    // ===== オンライン/オフライン =====
    window.addEventListener('online', () => { connText.textContent = 'オンライン'; });
    window.addEventListener('offline', () => { connText.textContent = 'オフライン'; });

    // ===== クリーンアップ =====
    window.addEventListener('beforeunload', () => {
      if (bansUnsubscribe) bansUnsubscribe();
      if (deviceBansUnsubscribe) deviceBansUnsubscribe();
      if (approvedUnsubscribe) approvedUnsubscribe();
      if (knownUsersUnsubscribe) knownUsersUnsubscribe();
    });
  </script>
</body>
</html>
