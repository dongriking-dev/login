<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>69ch ログイン</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='8' fill='%23d97706'/%3E%3Crect x='8' y='8' width='48' height='48' rx='4' fill='%23f59e0b'/%3E%3Crect x='14' y='18' width='36' height='36' rx='2' fill='%23ffffff' transform='rotate(-4 32 36)'/%3E%3Cpath d='M20 28h24M20 35h24M20 42h16' stroke='%2394a3b8' stroke-width='3' stroke-linecap='round' transform='rotate(-4 32 36)'/%3E%3Ccircle cx='32' cy='14' r='4' fill='%23ef4444'/%3E%3Ccircle cx='31' cy='13' r='1.5' fill='%23fca5a5'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loading-spinner {
      display: inline-block; width: 1.2rem; height: 1.2rem;
      border: 3px solid #f3f3f3; border-top: 3px solid #991b1b;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #statusBanner {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      text-align: center; padding: 6px; font-size: 12px;
      transition: transform 0.3s; transform: translateY(-100%);
    }
    #statusBanner.show { transform: translateY(0); }
    .pulse-dot {
      display: inline-block;
      width: 10px; height: 10px;
      background: #10b981;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 max-w-4xl mx-auto">

  <div id="statusBanner" class="bg-red-600 text-white"></div>

  <!-- ログイン画面 -->
  <div id="loginView">
    <div class="bg-white border border-gray-300 rounded-lg shadow p-8 max-w-md mx-auto mt-16 text-center">
      <h1 class="text-3xl font-bold text-red-900 mb-2">シクナイちゃんねる</h1>
      <p class="text-sm text-gray-600 mb-2">ログイン専用サイト</p>
      <p class="text-sm text-gray-600 mb-6">ご利用にはGoogleアカウントでのログインが必要です。</p>

      <button id="googleLoginBtn"
        class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold py-3 px-6 rounded shadow-sm flex items-center justify-center gap-3 mx-auto transition w-full">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C41.4 35.3 44 30.1 44 24c0-1.3-.1-2.3-.4-3.5z"/>
        </svg>
        Googleでログイン
      </button>

      <p class="text-xs text-amber-700 mt-4 bg-amber-50 border border-amber-200 rounded p-2">
        ⚠️ 初回ログイン時は管理者・主の承認が必要です
      </p>
    </div>
  </div>

  <!-- 承認待ち画面 -->
  <div id="pendingView" class="hidden">
    <div class="bg-amber-50 border-2 border-amber-400 rounded-lg shadow p-8 max-w-md mx-auto mt-16 text-center">
      <div class="text-5xl mb-4">⏳</div>
      <h2 class="text-2xl font-bold text-amber-800 mb-2">承認待ち</h2>
      <p class="text-sm text-gray-700 mb-4">
        管理者または主による承認をお待ちください。<br>
        承認されると、自動的にメインサイトへ移動します。
      </p>
      <p class="text-xs text-gray-500 mb-6">
        <span class="pulse-dot"></span>このページを開いたままにしてください
      </p>
      <div class="loading-spinner"></div>
      <p class="text-xs text-gray-500 mt-2">承認を待機中...</p>
      <button id="logoutPendingBtn" class="mt-6 text-xs text-gray-500 underline">ログアウト</button>
    </div>
  </div>

  <!-- 承認済み画面（自動遷移するので一瞬だけ表示） -->
  <div id="approvedView" class="hidden">
    <div class="bg-green-50 border-2 border-green-400 rounded-lg shadow p-8 max-w-md mx-auto mt-16 text-center">
      <div class="text-5xl mb-4">✅</div>
      <h2 class="text-2xl font-bold text-green-800 mb-2">承認済み</h2>
      <p class="text-sm text-gray-700 mb-2">メインサイトへ移動します...</p>
      <div class="loading-spinner"></div>
      <a id="goToMainBtn" href="#" class="mt-6 inline-block text-xs text-blue-600 underline">自動で移動しない場合はこちら</a>
    </div>
  </div>

  <!-- BAN画面 -->
  <div id="banView" class="hidden">
    <div class="bg-black text-white rounded-lg shadow p-8 max-w-md mx-auto mt-16 text-center">
      <div class="text-5xl mb-4">🚫</div>
      <h2 class="text-2xl font-bold mb-2">アクセスが拒否されました</h2>
      <p class="text-sm text-red-300 mb-6">このアカウントはBANされています。</p>
      <button id="logoutBanBtn" class="text-xs text-gray-300 underline">別のGoogleアカウントでログイン</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
    import {
      getDatabase, ref, push, set, remove, onValue, get, update
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      setPersistence, browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCoiJAnVWIOH9csEPlDyWJgfj6sSlNO2o",
      authDomain: "chaneler-52b95.firebaseapp.com",
      projectId: "chaneler-52b95",
      databaseURL: "https://chaneler-52b95-default-rtdb.firebaseio.com",
      storageBucket: "chaneler-52b95.firebasestorage.app",
      messagingSenderId: "538510918184",
      appId: "1:538510918184:web:58232aa80922ff00b92b1d",
      measurementId: "G-QF3LDMNQYQ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    setPersistence(auth, browserLocalPersistence).catch(() => {});

    const ROLE_ADMIN_EMAIL = "katou.noel114514@gmail.com";
    const ROLE_OWNER_EMAIL = "18107@v.nakijin.ed.jp";
    const ROLE_VIP_EMAILS = [
      "18104@v.nakijin.ed.jp",
      "setsu.setsuna1229@gmail.com",
      "roblox.2026.20th@gmail.com"
    ];

    // ★ 本サイトのURL
    const MAIN_SITE_URL = "https://7chanel.noel-k27.workers.dev/";

    let currentUser = null;
    let pendingUnsubscribe = null;
    let approvedUnsubscribe = null;
    let bansUnsubscribe = null;
    let knownUsersUnsubscribe = null;

    let pendingCache = {};
    let approvedCache = {};
    let bansCache = {};
    let knownUsersCache = {};

    let intentionalSignOut = false;
    let redirectTimer = null;

    const loginView = document.getElementById('loginView');
    const pendingView = document.getElementById('pendingView');
    const approvedView = document.getElementById('approvedView');
    const banView = document.getElementById('banView');
    const statusBanner = document.getElementById('statusBanner');
    const goToMainBtn = document.getElementById('goToMainBtn');
    let bannerTimer = null;

    function showBanner(msg, isError = true) {
      statusBanner.textContent = msg;
      statusBanner.className = (isError ? 'bg-red-600' : 'bg-green-600') + ' text-white show';
      statusBanner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;text-align:center;padding:6px;font-size:12px;transform:translateY(0);';
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => {
        statusBanner.style.transform = 'translateY(-100%)';
      }, 4000);
    }

    function showOnly(view) {
      [loginView, pendingView, approvedView, banView].forEach(v => {
        if (v === view) v.classList.remove('hidden');
        else v.classList.add('hidden');
      });
    }

    function roleFromEmail(email) {
      if (email === ROLE_ADMIN_EMAIL) return 'admin';
      if (email === ROLE_OWNER_EMAIL) return 'owner';
      if (ROLE_VIP_EMAILS.includes(email)) return 'vip';
      return null;
    }

    function emailToKey(email) {
      if (!email) return '';
      const lower = email.toLowerCase().trim();
      let h1 = 0x811c9dc5;
      for (let i = 0; i < lower.length; i++) {
        h1 ^= lower.charCodeAt(i);
        h1 = Math.imul(h1, 0x01000193);
      }
      return 'em_' + (h1 >>> 0).toString(16).padStart(8, '0');
    }

    function isApproved(uid) {
      return !!approvedCache[uid];
    }

    function isBanned(uid, email) {
      if (bansCache[uid]) return true;
      const ek = emailToKey(email);
      if (ek && bansCache[ek]) return true;
      return false;
    }

    // 既存ユーザーの自動承認
    async function migrateExistingUser(user) {
      if (!user) return false;
      if (approvedCache[user.uid]) return true;
      // knownUsers に記録があれば既存ユーザー
      if (knownUsersCache[user.uid]) {
        try {
          await set(ref(db, `approvedUsers/${user.uid}`), {
            email: user.email || '',
            displayName: user.displayName || '',
            approvedAt: Date.now(),
            approvedBy: 'auto-migration'
          });
          await remove(ref(db, `pendingUsers/${user.uid}`));
          console.log('既存ユーザーを自動承認:', user.email);
          return true;
        } catch (e) {
          console.warn('自動承認失敗:', e.message);
          return false;
        }
      }
      return false;
    }

    async function requestApproval(user) {
      if (!user) return;
      try {
        await set(ref(db, `pendingUsers/${user.uid}`), {
          email: user.email || '',
          displayName: user.displayName || '',
          requestedAt: Date.now()
        });
      } catch (e) {
        console.warn('承認申請失敗:', e.message);
      }
    }

    // メインサイトへリダイレクト（1回だけ）
    function redirectToMain() {
      if (redirectTimer) return;
      redirectTimer = setTimeout(() => {
        window.location.replace(MAIN_SITE_URL);
      }, 500);
    }

    function initListeners() {
      if (pendingUnsubscribe) pendingUnsubscribe();
      if (approvedUnsubscribe) approvedUnsubscribe();
      if (bansUnsubscribe) bansUnsubscribe();
      if (knownUsersUnsubscribe) knownUsersUnsubscribe();

      pendingUnsubscribe = onValue(ref(db, 'pendingUsers'), (snap) => {
        pendingCache = snap.exists() ? snap.val() : {};
        updateView();
      });
      approvedUnsubscribe = onValue(ref(db, 'approvedUsers'), (snap) => {
        approvedCache = snap.exists() ? snap.val() : {};
        updateView();
      });
      bansUnsubscribe = onValue(ref(db, 'bans'), (snap) => {
        bansCache = snap.exists() ? snap.val() : {};
        updateView();
      });
      knownUsersUnsubscribe = onValue(ref(db, 'knownUsers'), (snap) => {
        knownUsersCache = snap.exists() ? snap.val() : {};
      });
    }

    async function updateView() {
      if (!currentUser) {
        showOnly(loginView);
        return;
      }

      const uid = currentUser.uid;
      const email = currentUser.email;
      const role = roleFromEmail(email);

      // BANチェック
      if (isBanned(uid, email)) {
        showOnly(banView);
        return;
      }

      // 管理者・主・VIPは無条件で承認済み
      if (role === 'admin' || role === 'owner' || role === 'vip') {
        showOnly(approvedView);
        goToMainBtn.href = MAIN_SITE_URL;
        redirectToMain();
        return;
      }

      // 承認済み
      if (isApproved(uid)) {
        showOnly(approvedView);
        goToMainBtn.href = MAIN_SITE_URL;
        redirectToMain();
        return;
      }

      // 既存ユーザーなら自動承認を試みる
      const migrated = await migrateExistingUser(currentUser);
      if (migrated) {
        // approvedUsers の更新を待つ（onValueで再帰的にupdateViewが呼ばれる）
        return;
      }

      // 承認待ち
      if (pendingCache[uid]) {
        showOnly(pendingView);
        return;
      }

      // どれでもない → 承認申請
      await requestApproval(currentUser);
      showOnly(pendingView);
    }

    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error('ログインエラー:', err);
        if (err.code !== 'auth/popup-closed-by-user') {
          alert('ログインに失敗しました: ' + (err.message || ''));
        }
      }
    });

    async function doLogout() {
      intentionalSignOut = true;
      if (redirectTimer) { clearTimeout(redirectTimer); redirectTimer = null; }
      try { await signOut(auth); } catch (e) { console.error(e); }
      showOnly(loginView);
      setTimeout(() => { intentionalSignOut = false; }, 500);
    }
    document.getElementById('logoutPendingBtn').addEventListener('click', doLogout);
    document.getElementById('logoutBanBtn').addEventListener('click', doLogout);

    onAuthStateChanged(auth, async (user) => {
      if (intentionalSignOut) return;
      currentUser = user;
      if (!user) {
        showOnly(loginView);
        return;
      }
      initListeners();
      await updateView();
    });

    window.addEventListener('beforeunload', () => {
      if (pendingUnsubscribe) pendingUnsubscribe();
      if (approvedUnsubscribe) approvedUnsubscribe();
      if (bansUnsubscribe) bansUnsubscribe();
      if (knownUsersUnsubscribe) knownUsersUnsubscribe();
    });
  </script>
</body>
</html>
